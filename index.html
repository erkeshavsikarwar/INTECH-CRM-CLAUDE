@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--sf:#161c26;--tx:#e6eaf1;--mu:#93a0b4;--bd:#263042;--ac:#5b8def;--ac2:#07122b;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171;--nav:#0a0f16;--hv:#1b2330;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--sf:#161c26;--tx:#e6eaf1;--mu:#93a0b4;--bd:#263042;--ac:#5b8def;--ac2:#07122b;--ok:#4ade80;--wa:#fbbf24;--bad:#f87171;--nav:#0a0f16;--hv:#1b2330;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:var(--ac2);border:1px solid var(--ac);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:600;min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:var(--hv);filter:none}
.btn.s{padding:5px 10px;font-size:13px;min-height:32px}.btn.r{color:var(--bad)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--sf);min-height:40px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:2px solid color-mix(in srgb,var(--ac) 30%,transparent);outline-offset:0}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:12px 0 4px}
h2,h3{letter-spacing:-.01em}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:18px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
/* ---------- login ---------- */
#login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,var(--nav) 0,var(--nav) 34%,var(--bg) 34%)}
.lg{width:100%;max-width:400px;padding:26px 24px;box-shadow:0 12px 40px #0003}
.lg .lgw{text-align:center;margin:-62px 0 14px}
.lg h1{margin:0 0 2px;font-size:23px;text-align:center}.lg p{color:var(--mu);margin:0 0 10px;text-align:center}
/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;min-height:100dvh}
nav.side{background:var(--nav);color:#c9d2e0;padding:18px 12px;position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{padding:2px 6px 18px}
nav.side button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px;cursor:pointer;color:inherit;font-size:14.5px;min-height:42px}
nav.side button i{font-style:normal;width:22px;text-align:center;font-size:16px}
nav.side button:hover{background:#ffffff12}
nav.side button.on{background:#ffffff1f;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #ef4444}
nav.side .sp{flex:1}
nav.side small{opacity:.7}
main{padding:28px 34px 40px;min-width:0;max-width:1320px;width:100%}
.mbar,.tabs,.sheet,.sheet-bg{display:none}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;flex:1;font-size:24px;min-width:140px}
.top input{max-width:240px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:16px 18px}
.stat small{color:var(--mu);display:block;font-size:13px}
.stat b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--mu);font-weight:600;white-space:nowrap}
.lt tr:not(.hd):hover td{background:var(--hv)}
.one td,.one th{white-space:nowrap}.one .tn{display:inline-block;max-width:230px;white-space:normal;vertical-align:top;line-height:1.35}.one{min-width:860px}
.lw{padding:4px 6px}
.top>small{order:5}
.act{white-space:nowrap}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;border:1px solid var(--bd);font-size:12.5px;background:var(--hv)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.al{padding:10px 14px;margin-bottom:8px;background:var(--sf);border-radius:10px;border:1px solid var(--bd);border-left:4px solid var(--wa);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.al div{flex:1;min-width:180px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--tx);width:min(500px,94vw);max-height:90vh;max-height:90dvh;padding:20px;overflow:auto}
dialog::backdrop{background:#0009}
/* ---------- tablet & mobile ---------- */
@media(max-width:900px){
 body{font-size:15px}
 #app{grid-template-columns:1fr}
 nav.side{display:none}
 .mbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:var(--nav);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
 .mbar .btn{background:#ffffff1a;border-color:transparent;color:#fff;min-width:42px;min-height:42px;padding:0}
 main{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
 .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 .tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;min-height:54px;color:var(--mu);font-size:11.5px;cursor:pointer;border-radius:10px}
 .tabs button i{font-style:normal;font-size:20px;line-height:1.2}
 .tabs button.on{color:var(--ac);font-weight:700}
 .sheet-bg{display:block;position:fixed;inset:0;background:#0007;z-index:30}
 .sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sf);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px #0004}
 .sheet button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);padding:13px 6px;text-align:left;font-size:16px;cursor:pointer;min-height:50px}
 .sheet button:last-child{border-bottom:0}.sheet button i{font-style:normal;width:26px;text-align:center}
 .sheet button.on{color:var(--ac);font-weight:700}
 input,select,textarea{font-size:16px;min-height:44px}
 .btn{min-height:44px}.btn.s{min-height:38px;padding:6px 12px}
 .top h2{font-size:21px;order:1;flex:1 1 auto}
 .top #sq{max-width:none;flex:1 1 100%}
 .top>*{order:4}
 .top>[data-add]{order:2}
 .top>#sq{order:3}
 .grid{grid-template-columns:1fr 1fr;gap:10px}
 .stat{padding:13px 14px}.stat b{font-size:21px}
 .row2{grid-template-columns:1fr}
 .card{padding:15px}
 .lw{background:none!important;border:0!important;padding:0!important;overflow:visible}
 .lt,.lt tbody{display:block;min-width:0!important;width:100%}
 .lt tr.hd{display:none}
 .lt tr{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
 .lt td{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:5px 0;border:0!important;white-space:normal!important;text-align:right;background:none!important}
 .lt td[data-l]::before{content:attr(data-l);color:var(--mu);font-size:12.5px;text-align:left;flex:0 0 36%}
 .lt td.ttl{order:-1;display:block;text-align:left;font-size:16.5px;font-weight:700;padding:0 0 6px}
 .lt td.ttl .tn{max-width:none;white-space:normal;display:block}
 .lt td .bar{flex:1}
 .lt td.e{display:none}
 .top>small{order:5}
 .lt td.act{justify-content:flex-start;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid var(--bd)!important}
 .lt td select{max-width:62%}
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92vh;max-height:92dvh;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
 #login{background:linear-gradient(180deg,var(--nav) 0,var(--nav) 30%,var(--bg) 30%)}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
@media print{.mbar,.tabs,nav.side{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

 ${tabs}<div class="card tw lw"><table class="lt ${m=='tenders'?'one':''}"><tr class="hd">${hd.map(h=>`<th>${esc(h)}</th>`).join('')}<th></th></tr>${shown.map(r=>`<tr>${cfg.c.map((k,i)=>['name','title','no'].includes(k)?`<td class="ttl">${cell(k,r,m)}</td>`:`<td data-l="${esc(hd[i])}"${cell(k,r,m)===''?' class="e"':''}>${cell(k,r,m)}</td>`).join('')}<td class="act">${m=='tenders'?`<button class="btn g s" data-wa="${r.id}" title="WhatsApp reminder">💬</button> <button class="btn g s" data-fn="${r.id}" title="Copy folder name">📁</button> `:''}${m=='tenders'&&r.link?`<a class="btn g s" href="${esc(r.link)}" target="_blank" rel="noopener" style="text-decoration:none" title="Open Drive folder">📂</a> `:''}${m=='tasks'?`<button class="btn g s" data-tg="${r.id}">${r.done?'Undo':'Done'}</button> `:''}${m=='quotes'?`<button class="btn g s" data-pr="${r.id}">Print</button> `:''}<button class="btn g s" data-ed="${m}|${r.id}">Edit</button> ${me.role=='admin'?`<button class="btn g s r" data-dl="${m}|${r.id}">✕</button>`:''}</td></tr>`).join('')||`<tr><td colspan="9" style="color:var(--mu)">No records yet. Click “+ Add”.</td></tr>`}</table></div>${more}`;
}
function csv(m){
 const f=E[m].f.filter(x=>x[2]!='check'||1);const L=[f.map(x=>x[1]).join(',')];
 db[m].forEach(r=>L.push(f.map(([k])=>'"'+String(k=='client'?clientName(r[k]):r[k]??'').replace(/"/g,'""')+'"').join(',')));
 dl(L.join('\n'),m+'.csv','text/csv');
}
function dl(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function printQuote(id){
 const x=db.quotes.find(a=>a.id==id),w=window.open('','_blank');if(!w)return;
 w.document.write(`<title>Quotation ${esc(x.no)}</title><body style="font-family:sans-serif;max-width:700px;margin:30px auto">${logo()}<h2>INTECH ENGINEERS</h2><h3>Quotation ${esc(x.no)}</h3><p>Date: ${esc(fd(x.date))}<br>To: ${esc(clientName(x.client))}</p><table border="1" cellpadding="8" style="border-collapse:collapse;width:100%"><tr><th>Description</th><th>Amount</th></tr><tr><td>${esc(x.item)}</td><td>${inr(x.amount)}</td></tr><tr><td>GST @ ${esc(x.gst)}%</td><td>${inr(quoteTotal(x)-x.amount)}</td></tr><tr><th>Total</th><th>${inr(quoteTotal(x))}</th></tr></table><script>print()<\/script>`);w.document.close();
}
const NAV=[['dash','📊','Dashboard'],['clients','👥','Clients'],['tenders','📑','Tenders'],['ai','🤖','AI Assistant'],['projects','🏗','Projects'],['quotes','🧾','Quotations'],['tasks','✅','Tasks'],['team','⚙','Settings']];
const TABS=['dash','tenders','clients','tasks'],MORE=NAV.map(n=>n[0]).filter(k=>!TABS.includes(k));
function draw(){
 if(!me)return loginView();if(!synced){synced=1;syncSheet();setTimeout(()=>{autoRemind();remindPopup()},4000)}
 const nb=(k,i,l,c)=>`<button data-v="${k}" class="${view==k?'on':''}"><i>${i}</i>${c?'':l}${c?`<span>${l}</span>`:''}</button>`;
 R.innerHTML=`<div id="app"><nav class="side"><div class="brand">${logo(44)}</div>${NAV.map(([k,i,l])=>nb(k,i,l)).join('')}<div class="sp"></div><button data-th><i>🌓</i>Theme</button><button data-lo><i>⏻</i><span>Logout <small>(${esc(me.user)})</small></span></button></nav>
 <header class="mbar">${logo(34)}<button class="btn" data-th aria-label="Switch theme">🌓</button></header>
 <main>${banner()}${view=='dash'?dash():view=='team'?team():view=='ai'?ai():listView(view)}</main>
 <div class="tabs">${TABS.map(k=>NAV.find(n=>n[0]==k)).map(([k,i,l])=>nb(k,i,l,1)).join('')}<button data-moremenu class="${MORE.includes(view)||more?'on':''}"><i>☰</i><span>More</span></button></div>
 ${more?`<div class="sheet-bg" data-closemore></div><div class="sheet">${NAV.filter(n=>MORE.includes(n[0])).map(([k,i,l])=>nb(k,i,l)).join('')}<button data-lo><i>⏻</i>Logout (${esc(me.user)})</button></div>`:''}</div>`;
 bind();
}
function bind(){
 const on=(sel,fn)=>R.querySelectorAll(sel).forEach(e=>e.onclick=()=>fn(e));
 on('[data-v]',e=>{view=e.dataset.v;q='';more=false;draw();scrollTo(0,0)});
 on('[data-moremenu]',()=>{more=!more;draw()});on('[data-closemore]',()=>{more=false;draw()});
 on('[data-add]',e=>openForm(e.dataset.add));
 on('[data-ed]',e=>openForm(...e.dataset.ed.split('|')));
 on('[data-dl]',e=>{const[m,id]=e.dataset.dl.split('|');if(confirm('Delete this record?')){db[m]=db[m].filter(x=>x.id!=id);save();draw()}});
 on('[data-tg]',e=>{const t=db.tasks.find(x=>x.id==e.dataset.tg);t.done=!t.done;save();draw()});
 on('[data-wa]',e=>{if(!db.set.wa){alert('Set the reminder WhatsApp number under Settings first.');return}wa(db.tenders.find(x=>x.id==e.dataset.wa))});
 on('[data-fn]',e=>{const t=db.tenders.find(x=>x.id==e.dataset.fn);navigator.clipboard&&navigator.clipboard.writeText(folder(t)).then(()=>alert('Copied: '+folder(t)),()=>prompt('Folder name',folder(t)))});
 on('[data-pr]',e=>printQuote(e.dataset.pr));
 on('[data-ex]',e=>csv(e.dataset.ex));
 on('[data-th]',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'});
 on('[data-lo]',async()=>{
  if(CLOUD_ON&&dirty){clearTimeout(pend);await push();if(dirty&&!confirm('Some changes could not be uploaded yet. Logout anyway?'))return}
  more=false;me=null;sess=null;synced=0;sessionStorage.removeItem('intech_sess');sessionStorage.removeItem('intech_pop');
  if(CLOUD_ON){db=norm(null);dirty=false;base=0;cloudMsg=''}
  draw()});
 const s=$('#sq');if(s)s.oninput=()=>{q=s.value;tshow=10;const p=s.selectionStart;draw();const n=$('#sq');n.focus();n.setSelectionRange(p,p)};
 const wp=$('#wp');if(wp){const up=()=>{const p=wp.value,T={cmb:['CallMeBot API key','','','Send “I allow callmebot to send me messages” to +34 644 51 95 23 on WhatsApp to get the key.'],green:['','Instance ID (idInstance)','API token (apiTokenInstance)','Sign up at green-api.com, create an instance, scan the QR with your WhatsApp, then copy the ID and token.'],ultra:['','Instance ID (e.g. instance12345)','Token','Sign up at ultramsg.com, connect your WhatsApp and copy the instance ID and token.'],hook:['','Webhook URL','','Make/Zapier/n8n webhook URL. It receives JSON: phone, message, tender, tender_id, date, time, link.']}[p];[['#wk','#l1',0],['#w1','#l2',1],['#w2','#l3',2]].forEach(([i,l,n])=>{$(i).style.display=$(l).style.display=T[n]?'':'none';if(T[n])$(l).textContent=T[n]});$('#wh').textContent=T[3]};wp.onchange=up;up()}
 const sw=$('#sw');if(sw)sw.onclick=()=>{db.set.wa=$('#wn').value.trim();db.set.cmb=$('#wk').value.trim();db.set.prov=$('#wp').value;db.set.p1=$('#w1').value.trim();db.set.p2=$('#w2').value.trim();save();alert('Saved.');autoRemind()};
 R.querySelectorAll('[data-st]').forEach(e=>e.onchange=()=>{const t=db.tenders.find(x=>x.id==e.dataset.st);t.status=e.value;t.lock=1;save();draw()});
 R.querySelectorAll('[data-aw]').forEach(e=>e.onchange=()=>{const t=db.tenders.find(x=>x.id==e.dataset.aw);t.award=e.value;t.lockA=1;save();draw()});
 on('[data-clr]',()=>{tf='all';af='';auf='';tshow=10;draw()});
 R.querySelectorAll('[data-sel]').forEach(e=>e.onchange=()=>{e.dataset.sel=='af'?af=e.value:auf=e.value;tshow=10;draw()});
 on('[data-tf]',e=>{tf=e.dataset.tf;tshow=10;draw()});on('[data-more]',e=>{const v=e.dataset.more;tshow=v=='all'?1e9:v=='less'?10:tshow+10;draw()});
 on('[data-sy]',()=>syncSheet(true));on('[data-ic]',()=>$('#icf').click());
 const icf=$('#icf');if(icf)icf.onchange=()=>{const f=icf.files[0];if(f)f.text().then(t=>syncSheet(true,csvParse(t)))};
 const ab=$('#ab'),aqi=$('#aq');if(ab){ab.onclick=()=>{aq=aqi.value;draw()};aqi.onkeydown=e=>{if(e.key=='Enter'){aq=aqi.value;draw()}}}
 on('[data-bw]',()=>{if(!db.set.wa){alert('Set the reminder WhatsApp number under Settings first.');return}window.open('https://wa.me/'+db.set.wa.replace(/\D/g,'')+'?text='+encodeURIComponent(brief()),'_blank')});
 on('[data-bc]',()=>navigator.clipboard&&navigator.clipboard.writeText(brief()).then(()=>alert('Copied.')));
 const ss=$('#ss');if(ss)ss.onclick=()=>{db.set.sheet=$('#sid').value.trim().replace(/.*\/d\/([^\/?#]+).*/,'$1');db.set.gid=$('#sgid').value.trim()||'0';save();syncSheet(true)};
 const lf=$('#lf');if(lf)lf.onchange=()=>{const f=lf.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.set.logo=c.toDataURL('image/png');save();draw()};im.src=URL.createObjectURL(f)};
 const bk=$('#bk');if(bk)bk.onclick=()=>dl(JSON.stringify(db),'intech-crm-backup.json','application/json');
 const rs=$('#rs');if(rs)rs.onclick=()=>$('#rf').click();
 const rf=$('#rf');if(rf)rf.onchange=()=>{const f=rf.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!Array.isArray(o.tenders)&&!Array.isArray(o.clients))throw 0;db=norm(o);save();draw()}catch(e){alert('Invalid backup file.')}})};
}
function loginView(){
 R.innerHTML=`<div id="login"><div class="card lg"><div class="lgw">${logo(54)}</div><h1>Intech Engineers</h1><p>Sign in to your CRM</p><label>Username</label><input id="u" autocomplete="username" autocapitalize="none"><label>Password</label><input id="p" type="password" autocomplete="current-password"><div class="err" id="e">${esc(loginMsg)}</div><button class="btn" id="go" style="width:100%">Sign in</button></div></div>`;loginMsg='';
 const go=async()=>{
  const e=$('#e'),b=$('#go'),u=$('#u').value.trim().toLowerCase().replace(/\s+/g,' '),p=$('#p').value;
  if(Date.now()<lock){e.textContent='Too many attempts. Wait '+Math.ceil((lock-Date.now())/1000)+' seconds.';return}
  if(!u||!p){e.textContent='Enter username and password.';return}
  if(!crypto.subtle){e.textContent='Secure (https) connection required.';return}
  b.disabled=true;e.textContent='';
  const bad=m=>{fails++;if(fails>=5){lock=Date.now()+30000;fails=0}e.textContent=m||'Wrong username or password.';b.disabled=false};
  try{
   if(u!=OWNER)return bad();
   if(CLOUD_ON){
    let j;try{j=await jf('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+CLOUD.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:CLOUD.email,password:p,returnSecureToken:true})})}
    catch(x){return /INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(x.message)?bad():(e.textContent='Cloud login error: '+x.message,void(b.disabled=false))}
    sess={u:OWNER,idToken:j.idToken,refreshToken:j.refreshToken,exp:Date.now()+(+j.expiresIn)*1000};
    try{await pull(true)}catch(x){sess=null;e.textContent='Could not load data: '+x.message;b.disabled=false;return}
   }else{
    if(await hash(p)!=PWH)return bad();
    sess={u:OWNER,t:PWH};
   }
   fails=0;me={user:OWNER,role:'admin',name:'Intech Engineers'};sessionStorage.setItem('intech_sess',JSON.stringify(sess));synced=0;draw();
  }catch(x){e.textContent='Error: '+(x&&x.message||x);b.disabled=false}
 };
 $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key=='Enter')go()};$('#u').onkeydown=e=>{if(e.key=='Enter')go()};
}
async function boot(){
 if(me&&CLOUD_ON){R.innerHTML='<p style="padding:40px;text-align:center;color:var(--mu)">Loading…</p>';try{await pull(true)}catch(e){me=null;sess=null;sessionStorage.removeItem('intech_sess');loginMsg='Session expired. Please sign in again.'}}
 draw()}
const poll=async()=>{if(me&&CLOUD_ON&&!dirty&&!pushing){try{if(await pull(false))redraw()}catch(e){}}};
setInterval(()=>{if(me){syncSheet();autoRemind()}},120000);
setInterval(poll,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
boot();
</script></body></html>
